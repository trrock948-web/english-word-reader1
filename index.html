<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文單字朗讀練習</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6fa;color:#1f2937;font-family:Arial,"Noto Sans TC",sans-serif}
.wrap{max-width:940px;margin:30px auto;padding:0 18px 48px}
.panel{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
h1{margin:0 0 8px;font-size:30px}.sub{color:#64748b;margin-bottom:18px}
.controls{position:sticky;top:0;z-index:5;background:#fff;padding:14px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid #e5e7eb}
select,input{padding:9px 10px;font-size:16px;border:1px solid #cbd5e1;border-radius:9px}
input[type=number]{width:94px}
button{border:0;border-radius:10px;padding:10px 15px;font-size:15px;cursor:pointer;background:#111827;color:#fff}
button.secondary{background:#475569}button.light{background:#e2e8f0;color:#111827}
.status{margin:14px 0;padding:11px 13px;background:#f1f5f9;border-radius:10px;color:#334155}
.section{margin:24px 0 10px;font-size:20px;font-weight:700;color:#334155}
.item{border:1px solid #e2e8f0;border-radius:12px;padding:13px 15px;display:grid;grid-template-columns:70px 1.2fr 1.4fr auto;align-items:center;gap:10px;margin-bottom:8px}
.num{color:#64748b;font-weight:700}.word{font-size:21px;font-weight:700}.zh{font-size:16px;color:#475569}
.item.playing{outline:3px solid #94a3b8;background:#f8fafc}
.gap-note{margin:24px 0;padding:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;color:#9a3412}
@media(max-width:650px){.item{grid-template-columns:58px 1fr auto}.zh{grid-column:2/4}}
</style>
</head>

<div class="sub">目前收錄：301–500、701–800｜共 300 個單字</div>

<div class="controls">
<label>從第 <input id="startNum" type="number" min="301" max="800" value="301"> 個開始</label>
<label>速度 <select id="rate">
<option value="0.25" selected>🐢 超級慢（0.25x）</option>
<option value="0.6">很慢（0.6x）</option>
<option value="0.75">慢（0.75x）</option>
<option value="0.9">正常偏慢（0.9x）</option>
<option value="1">正常（1.0x）</option>
</select></label>
<button onclick="playFromStart()">▶ 開始播放</button>
<button class="secondary" onclick="stopSpeaking()">⏹ 停止</button>
<button class="light" onclick="restart()">↺ 回到 301</button>
</div>

<div id="status" class="status">共 300 個單字，尚未播放。</div>
<div id="content"></div>
</div></div>

let stopRequested=false,currentIndex=-1;

function render(){
  const box=document.getElementById("content");
  box.innerHTML="";
  let lastGroup="";
  WORDS.forEach((x,i)=>{
    const group=x.num<=500?"301–500":"701–800";
    if(group!==lastGroup){
      if(group==="701–800"){
        const gap=document.createElement("div");
        gap.className="gap-note";
        gap.textContent="501–700 目前尚未加入單字。";
        box.appendChild(gap);
      }
      const h=document.createElement("div");
      h.className="section";
      h.textContent=group;
      box.appendChild(h);
      lastGroup=group;
    }
    const row=document.createElement("div");
    row.className="item";
    row.id=`item-${i}`;
    row.innerHTML=`<div class="num">${x.num}</div><div class="word">${x.word}</div><div class="zh">${x.zh}</div><button onclick="playOne(${i})">🔊</button>`;
    box.appendChild(row);
  });
}

function getVoice(){
  const v=speechSynthesis.getVoices();
  return v.find(x=>/^en-US/i.test(x.lang))||v.find(x=>/^en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;
}
function spokenText(t){return t.replace(/\s*\/\s*/g,", ")}
function speak(t){
  return new Promise(done=>{
    const u=new SpeechSynthesisUtterance(spokenText(t));
    const v=getVoice();
    if(v)u.voice=v;
    u.lang=v?v.lang:"en-US";
    u.rate=parseFloat(document.getElementById("rate").value);
    u.pitch=1;
    u.onend=done;u.onerror=done;
    speechSynthesis.speak(u);
  });
}
function clearH(){document.querySelectorAll(".item").forEach(x=>x.classList.remove("playing"))}
function hi(i){
  clearH();
  const e=document.getElementById(`item-${i}`);
  if(e){e.classList.add("playing");e.scrollIntoView({behavior:"smooth",block:"center"})}
}
function findIndexByNum(n){return WORDS.findIndex(x=>x.num===n)}

async function playOne(i){
  stopRequested=false;
  speechSynthesis.cancel();
  await new Promise(r=>setTimeout(r,70));
  currentIndex=i;hi(i);
  document.getElementById("startNum").value=WORDS[i].num;
  document.getElementById("status").textContent=`正在播放第 ${WORDS[i].num} 個：${WORDS[i].word}`;
  await speak(WORDS[i].word);
  clearH();
  document.getElementById("status").textContent=`已播放第 ${WORDS[i].num} 個：${WORDS[i].word}`;
}

async function playFromStart(){
  const n=parseInt(document.getElementById("startNum").value||"301",10);
  const start=findIndexByNum(n);
  if(start<0){
    document.getElementById("status").textContent=
      (n>=501&&n<=700)?"501–700 目前尚未加入單字。":"找不到這個編號，請輸入目前已有的編號。";
    return;
  }
  stopRequested=false;
  speechSynthesis.cancel();
  await new Promise(r=>setTimeout(r,80));
  for(let i=start;i<WORDS.length;i++){
    if(stopRequested)break;
    currentIndex=i;
    document.getElementById("startNum").value=WORDS[i].num;
    hi(i);
    document.getElementById("status").textContent=`正在播放第 ${WORDS[i].num} 個：${WORDS[i].word}`;
    await speak(WORDS[i].word);
    if(stopRequested)break;
    await new Promise(r=>setTimeout(r,450));
  }
  clearH();
  document.getElementById("status").textContent=
    stopRequested?`已停止在第 ${WORDS[currentIndex].num} 個：${WORDS[currentIndex].word}`:"全部播放完成。";
}
function stopSpeaking(){
  stopRequested=true;speechSynthesis.cancel();clearH();
  if(currentIndex>=0)document.getElementById("startNum").value=WORDS[currentIndex].num;
}
function restart(){
  stopSpeaking();currentIndex=-1;
  document.getElementById("startNum").value=301;
  document.getElementById("status").textContent="已回到第 301 個。";
  window.scrollTo({top:0,behavior:"smooth"});
}
render();
speechSynthesis.onvoiceschanged=()=>{};
</script>
</body></html>
